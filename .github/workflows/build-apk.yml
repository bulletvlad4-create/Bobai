name: Build BOB AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract BOB AI archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -iname 'BOB-AI-Android-Studio*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "Архив BOB AI не найден!"
            exit 1
          fi
          unzip -o "$ARCHIVE" -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/BOB-AI-Android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bobai-APK
          path: extracted/BOB-AI-Android/app/build/outputs/apk/debug/*.apk
